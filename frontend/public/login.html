<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StableFlow Console — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0B0D0A;
      --charcoal: #171912;
      --charcoal-2: #1F221A;
      --green: #92CB3C;
      --sand: #C9C2AC;
      --off-white: #EDEDE6;
      --line: rgba(237, 237, 230, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--ink);
      color: var(--off-white);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--charcoal);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px;
      margin: 24px;
    }
    .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .logo-mark { width: 20px; height: 12px; background: var(--green); border-radius: 3px; }
    .logo-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.1rem; }
    .logo-sub { font-size: 0.75rem; color: var(--sand); font-weight: 400; margin-left: 6px; }
    h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
    .subtitle { font-size: 0.85rem; color: var(--sand); margin-bottom: 28px; }
    label { display: block; font-size: 0.8rem; color: var(--sand); margin-bottom: 6px; }
    input {
      width: 100%;
      background: var(--charcoal-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--off-white);
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
    }
    input:focus { border-color: var(--green); }
    .btn {
      width: 100%;
      background: var(--green);
      color: var(--ink);
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #a3dc4c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.83rem;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }
    .footer { margin-top: 24px; font-size: 0.75rem; color: var(--sand); text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo-mark"></div>
      <span class="logo-text">stub<span class="logo-sub">Console</span></span>
    </div>
    <h2>Sign in</h2>
    <p class="subtitle">Admin &amp; Finance access only</p>
    <div class="error" id="error-msg"></div>
    <form id="login-form" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username" />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      <button type="submit" class="btn" id="submit-btn">Sign In</button>
    </form>
    <div class="footer">StableFlow Settlement Console — Restricted Access</div>
    <div class="footer" style="margin-top: 10px;">Organiser? <a href="/register.html" style="color: var(--green); text-decoration: none; font-weight: 600;">Create an account →</a></div>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Login failed';
          errEl.classList.add('show');
          return;
        }

        // Store token + role + username for admin console use
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_role', data.role);
        localStorage.setItem('admin_username', data.username);

        // Also store in cookie so that initial page loads bypass requireAdmin middleware redirects
        document.cookie = `admin_token=${data.token}; path=/; SameSite=Strict`;

        window.location.href = '/admin/index.html';
      } catch (err) {
        errEl.textContent = 'Network error — is the server running?';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
